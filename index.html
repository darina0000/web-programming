<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteza - Все услуги вашего отеля в телефоне гостя</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header__container">
            <img src="images/Frame.png" alt="Hoteza" class="logo">
            <button class="btn btn--header">Подключиться сейчас</button>
        </div>
    </header>
            <!-- Hero Section -->
    <section class="hero">
        <div class="container hero__container">
            <div class="hero__content">
                <h1 class="hero__title">Все услуги вашего отеля сразу в телефоне гостя. Без установок.</h1>
                <div class="hero__demo">
                    <p class="hero__demo-title">Попробуйте демо</p>
                    <p class="hero__demo-text">Наведите камеру<br>смартфона на QR-код</p>
                </div>
            </div>
            <div class="hero__image-wrapper">
                <img src="images/phone.png" alt="Hoteza app" class="hero__image">
            </div>
        </div>
    </section>
</body>
</html>
